[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docseek"
dynamic = ["version"]
description = "Local full-text search for office documents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8",
  "PyMuPDF>=1.25",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "openpyxl>=3.1",
  "watchdog>=6.0",
]

[project.optional-dependencies]
# Rust-backed spreadsheet parser for XLS/XLSB/ODS with row/sheet fidelity.
calamine = ["python-calamine>=0.8.2"]
# Rust-native Apache Tika compatibility backend. No Java service is required;
# kept optional because its wheel is ~40 MiB and flat-text extraction is not
# always as structure-rich as DocSeek's specialized direct adapters.
tika = ["iscc-tika>=0.6.0"]
# Vendor fallback only; normal DocSeek startup never requires pywin32/WPS.
wps = ["pywin32>=306; platform_system == 'Windows'"]
# Keep the portable Windows build reproducible. This extra is never required by
# normal DocSeek users or normal test/runtime installations.
package = ["pyinstaller==6.22.2"]

[project.scripts]
docseek = "docseek.bootstrap:main"

[tool.setuptools.dynamic]
version = {attr = "docseek.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
