[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docseek"
version = "0.2.0"
description = "Local full-text search for office documents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8",
  "PyMuPDF>=1.25",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "openpyxl>=3.1",
  "watchdog>=6.0",
]

[project.optional-dependencies]
# Rust-backed spreadsheet parser. Kept optional until real-world XLS/XLSB/ODS
# compatibility and memory profiles are validated on target office machines.
calamine = ["python-calamine>=0.8.2"]
# Vendor fallback only; normal DocSeek startup never requires pywin32/WPS.
wps = ["pywin32>=306; platform_system == 'Windows'"]

[project.scripts]
docseek = "docseek.app:main"

[tool.setuptools.packages.find]
where = ["src"]
