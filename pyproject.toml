[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docseek"
version = "0.1.0"
description = "Local full-text search for office documents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8",
  "PyMuPDF>=1.25",
  "python-docx>=1.1",
  "openpyxl>=3.1",
]

[project.scripts]
docseek = "docseek.app:main"

[tool.setuptools.packages.find]
where = ["src"]
