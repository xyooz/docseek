name: windows-installer

on:
  workflow_dispatch:
  push:
    branches:
      - "rust/**"
    paths:
      - "packaging/windows/**"
      - "pyproject.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "src/docseek/scan_backend.py"
      - "src/docseek/indexer.py"
      - ".github/workflows/windows-installer.yml"
  pull_request:
    paths:
      - "packaging/windows/**"
      - "pyproject.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "src/docseek/scan_backend.py"
      - "src/docseek/indexer.py"
      - "src/docseek/__init__.py"
      - ".github/workflows/windows-installer.yml"

permissions:
  contents: read

jobs:
  build-install-uninstall:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install packaging dependencies
        run: python -m pip install -e ".[calamine,tika,wps,package]"

      - name: Build Setup.exe
        shell: pwsh
        run: ./packaging/windows/build_installer.ps1

      - name: Verify per-user install and uninstall lifecycle
        shell: pwsh
        run: ./packaging/windows/verify_installer.ps1

      - name: Report installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\DocSeek-*-Setup-x64.exe | Select-Object -First 1
          $sizeMiB = [Math]::Round($setup.Length / 1MB, 1)
          Write-Host "Installer: $($setup.Name) ($sizeMiB MiB)"
          Get-FileHash $setup.FullName -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: docseek-windows-installer
          path: dist/DocSeek-*-Setup-x64.exe
          if-no-files-found: error
          retention-days: 14
