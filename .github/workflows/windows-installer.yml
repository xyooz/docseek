name: windows-installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packaging/windows/**"
      - "pyproject.toml"
      - "src/docseek/__init__.py"
      - ".github/workflows/windows-installer.yml"

permissions:
  contents: read

jobs:
  build-install-uninstall:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packaging dependencies
        run: python -m pip install -e ".[calamine,tika,wps,package]"

      - name: Build Setup.exe
        shell: pwsh
        run: ./packaging/windows/build_installer.ps1

      - name: Verify per-user install and uninstall lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = Get-ChildItem dist\DocSeek-*-Setup-x64.exe | Select-Object -First 1
          if (-not $setup) { throw "Installer was not found" }

          $installDir = Join-Path $env:RUNNER_TEMP "DocSeek-installed"
          if (Test-Path $installDir) { Remove-Item -Recurse -Force $installDir }

          # User index/settings live outside the application directory. A
          # sentinel proves uninstall does not delete that user-owned state.
          $dataDir = Join-Path $env:USERPROFILE ".docseek"
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          $sentinel = Join-Path $dataDir "installer-preserve-sentinel.txt"
          Set-Content -Path $sentinel -Value "preserve-me" -Encoding utf8

          $install = Start-Process -FilePath $setup.FullName -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/SP-",
            "/DIR=$installDir",
            "/TASKS="
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Silent install failed with exit code $($install.ExitCode)"
          }

          $exe = Join-Path $installDir "DocSeek.exe"
          if (-not (Test-Path $exe)) { throw "Installed DocSeek.exe was not found" }

          $env:DOCSEEK_FROZEN_SMOKE = "1"
          try {
            $smoke = Start-Process -FilePath $exe -Wait -PassThru
            if ($smoke.ExitCode -ne 0) {
              throw "Installed DocSeek smoke failed with exit code $($smoke.ExitCode)"
            }
          }
          finally {
            Remove-Item Env:DOCSEEK_FROZEN_SMOKE -ErrorAction SilentlyContinue
          }

          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller was not created" }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART"
          ) -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "Silent uninstall failed with exit code $($uninstall.ExitCode)"
          }

          for ($attempt = 0; $attempt -lt 20 -and (Test-Path $installDir); $attempt++) {
            Start-Sleep -Milliseconds 250
          }
          if (Test-Path $installDir) {
            throw "Application directory remains after uninstall: $installDir"
          }
          if (-not (Test-Path $sentinel)) {
            throw "Uninstall removed DocSeek user index/settings data"
          }

          Remove-Item -Force $sentinel
          Write-Host "Install -> frozen smoke -> uninstall lifecycle passed; user data was preserved."

      - name: Report installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\DocSeek-*-Setup-x64.exe | Select-Object -First 1
          $sizeMiB = [Math]::Round($setup.Length / 1MB, 1)
          Write-Host "Installer: $($setup.Name) ($sizeMiB MiB)"
          Get-FileHash $setup.FullName -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: docseek-windows-installer
          path: dist/DocSeek-*-Setup-x64.exe
          if-no-files-found: error
          retention-days: 14
