name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[calamine,tika]"
      - name: Compile
        run: python -m compileall -q src tests benchmarks
      - name: Smoke import desktop app
        run: python -c "import docseek.app"
      - name: Benchmark search at 1k files
        run: python benchmarks/benchmark_search.py --files 1000 --chunks 3 --payload-kb 4 --batch-size 128 --iterations 3 --warmups 1 --limit 100
      - name: Benchmark persistent search session at 1k files
        run: python benchmarks/benchmark_search_session.py --files 1000 --chunks 3 --payload-kb 4 --batch-size 128 --iterations 3 --limit 100
      - name: Retrieval quality baseline
        run: python benchmarks/evaluate_retrieval.py --k 5 --assert-baseline
      - name: One-shot filename index split experiment
        if: contains(github.event.head_commit.message, '[filename-bench]')
        run: python benchmarks/benchmark_filename_split.py --files 5000 --chunks 12 --payload-kb 1 --iterations 5
      - name: Scale baseline at 10k files
        if: contains(github.event.head_commit.message, '[scale-10k]') || contains(github.event.head_commit.message, '[grouped-bench]')
        run: python benchmarks/benchmark_grouped_office.py --files 10000 --chunks 3 --payload-kb 4 --batch-size 128 --iterations 3 --warmups 1 --limit 100 --max-grouped-p95-ms 200 --json-out scale-10k.json
      - name: Scale pressure test at 50k files
        if: contains(github.event.head_commit.message, '[scale-50k]')
        run: python benchmarks/benchmark_grouped_office.py --files 50000 --chunks 3 --payload-kb 4 --batch-size 128 --iterations 3 --warmups 1 --limit 100 --max-grouped-p95-ms 500 --json-out scale-50k.json
      - name: One-shot first-paint deferred-count experiment
        if: contains(github.event.head_commit.message, '[first-paint-bench]')
        run: python benchmarks/benchmark_first_paint.py --files 10000 --chunks 3 --payload-kb 4 --iterations 3 --warmups 1 --limit 100
      - name: One-shot compressed raw chunk experiment
        if: contains(github.event.head_commit.message, '[compression-bench]')
        run: python benchmarks/benchmark_chunk_compression.py --files 5000 --chunks 3 --payload-kb 4 --iterations 5 --delete-documents 100 --limit 100
      - name: One-shot varied-text compression experiment
        if: contains(github.event.head_commit.message, '[compression-varied-bench]')
        run: python benchmarks/benchmark_chunk_compression.py --files 5000 --chunks 3 --payload-kb 4 --iterations 5 --delete-documents 100 --limit 100 --profile varied
      - name: One-shot first-index component profile
        if: contains(github.event.head_commit.message, '[index-profile]')
        run: python benchmarks/benchmark_index_profile.py --files 1000 --chunks 3 --payload-kb 4 --batch-size 128
      - name: One-shot indexing batch-size sweep
        if: contains(github.event.head_commit.message, '[batch-bench]')
        run: python benchmarks/benchmark_batch_size.py --files 2000 --chunks 3 --payload-kb 4 --iterations 2 --batch-sizes 64 128 256 512 1024
      - name: One-shot compact CJK candidate-index experiment
        if: contains(github.event.head_commit.message, '[cjk-candidate-bench]')
        run: python benchmarks/benchmark_cjk_candidate.py --files 2000 --chunks 3 --payload-kb 4 --iterations 3
      - name: One-shot native-trigram CJK hybrid experiment
        if: contains(github.event.head_commit.message, '[cjk-trigram-bench]')
        run: python benchmarks/benchmark_cjk_trigram_hybrid.py --files 2000 --chunks 3 --payload-kb 4 --iterations 3
      - name: One-shot real XLSX indexing benchmark
        if: contains(github.event.head_commit.message, '[xlsx-bench]')
        run: python benchmarks/benchmark_xlsx_real.py --rows 20000 --sheets 2 --columns 10 --query-iterations 5
      - name: One-shot XLSX backend comparison
        if: contains(github.event.head_commit.message, '[xlsx-backend-bench]')
        run: python benchmarks/benchmark_xlsx_backends.py --rows 20000 --sheets 2 --columns 10 --rows-per-chunk 200 --require-equivalent
      - name: One-shot real XLSX 100k scale benchmark
        if: contains(github.event.head_commit.message, '[xlsx-scale-bench]')
        run: python benchmarks/benchmark_xlsx_real.py --rows 50000 --sheets 2 --columns 10 --query-iterations 3
      - name: One-shot real XLSX 200k scale benchmark
        if: contains(github.event.head_commit.message, '[xlsx-scale-bench]')
        run: python benchmarks/benchmark_xlsx_real.py --rows 100000 --sheets 2 --columns 10 --query-iterations 3
      - name: One-shot first-index candidate overhead profile
        if: contains(github.event.head_commit.message, '[candidate-bench]')
        run: python benchmarks/benchmark_candidate_overhead.py --files 10000
      - name: One-shot directory discovery profile at 10k files
        if: contains(github.event.head_commit.message, '[discovery-bench]')
        run: python benchmarks/benchmark_scan.py --files 10000
      - name: Directory scan smoke
        run: python benchmarks/benchmark_scan.py --files 20
      - name: Test
        run: python -m unittest discover -s tests -v
