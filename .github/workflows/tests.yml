name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src tests benchmarks
      - name: Smoke import desktop app
        run: python -c "import docseek.app"
      - name: Benchmark search at 1k files
        run: python benchmarks/benchmark_search.py --files 1000 --chunks 3 --payload-kb 4 --iterations 3 --warmups 1 --limit 100
      - name: Benchmark file-id layout at 1k files
        run: python benchmarks/benchmark_fileid_layout.py --files 1000 --chunks 3 --payload-kb 4 --path-chars 120 --iterations 3 --limit 100
      - name: Directory scan smoke
        run: python benchmarks/benchmark_scan.py --files 20
      - name: Test
        run: python -m unittest discover -s tests -v
