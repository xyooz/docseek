name: benchmark-scan-backends

on:
  workflow_dispatch:
    inputs:
      files:
        description: "Synthetic file count per sparse/dense case"
        required: true
        default: "10000"
        type: choice
        options:
          - "10000"
          - "50000"
          - "100000"
      scenario:
        description: "Synthetic file composition"
        required: true
        default: both
        type: choice
        options:
          - sparse
          - dense
          - both

permissions:
  contents: read

jobs:
  scan-backends:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install benchmark dependencies
        run: python -m pip install -e ".[benchmarks]"

      - name: Build and install PyO3 wheel
        shell: pwsh
        run: |
          python -m pip install "maturin>=1.7,<2"
          maturin build --interpreter python --manifest-path crates/docseek-python/Cargo.toml --release
          python -c "import glob, os, subprocess, sys; wheels=sorted(glob.glob('target/wheels/docseek_rust-*.whl'), key=os.path.getmtime); assert wheels, 'no docseek_rust wheel'; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', wheels[-1]])"
          python -c "import docseek_rust; print(docseek_rust.__file__)"

      - name: Run scanner-only Python/Rust benchmark
        run: >-
          python benchmarks/benchmark_scan_backends.py
          --files ${{ inputs.files }}
          --scenario ${{ inputs.scenario }}
          --backend both
          --json-out benchmark-results.json

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: docseek-scan-backend-benchmark-${{ inputs.files }}-${{ inputs.scenario }}
          path: benchmark-results.json
          if-no-files-found: error
          retention-days: 30
