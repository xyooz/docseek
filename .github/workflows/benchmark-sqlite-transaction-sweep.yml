name: benchmark-sqlite-transaction-sweep

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Git ref containing the transaction sweep benchmark"
        required: true
        default: "perf/sqlite-transaction-ab"
        type: string

permissions:
  contents: read

jobs:
  windows-sqlite-transaction-sweep:
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install benchmark and parser dependencies
        run: python -m pip install -e ".[calamine,tika,wps,benchmarks]"

      - name: Build and install PyO3 wheel
        shell: pwsh
        run: |
          python -m pip install "maturin>=1.7,<2"
          maturin build --interpreter python --manifest-path crates/docseek-python/Cargo.toml --release
          python -c "import glob, os, subprocess, sys; wheels=sorted(glob.glob('target/wheels/docseek_rust-*.whl'), key=os.path.getmtime); assert wheels, 'no docseek_rust wheel'; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', wheels[-1]])"
          python -c "import docseek_rust; print(docseek_rust.__file__)"

      - name: Record Windows runner
        shell: pwsh
        run: |
          python --version
          rustc --version
          Get-ComputerInfo | Select-Object CsName, OsName, OsVersion, CsProcessors, CsTotalPhysicalMemory

      - name: Run SQLite transaction sweep
        shell: pwsh
        run: |
          $report = "benchmark-transaction-sweep-windows.txt"
          python benchmarks/benchmark_transaction_sweep.py `
            --workload tiny-text `
            --workload medium-text `
            --workload large-text `
            --backend both `
            --capacities 128 256 512 1024 files `
            --cancel-files 2000 `
            --json-out benchmark-transaction-sweep-windows.json 2>&1 | Tee-Object -FilePath $report
          if ($LASTEXITCODE -ne 0) {
            throw "SQLite transaction sweep failed with exit code $LASTEXITCODE"
          }

      - name: Upload SQLite transaction sweep reports
        uses: actions/upload-artifact@v4
        with:
          name: docseek-sqlite-transaction-sweep-windows
          path: |
            benchmark-transaction-sweep-windows.txt
            benchmark-transaction-sweep-windows.json
          if-no-files-found: error
          retention-days: 30
