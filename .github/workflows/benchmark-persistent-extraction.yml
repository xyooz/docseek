name: benchmark-persistent-extraction

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Git ref containing the production persistent worker"
        required: true
        default: "rust/persistent-extraction-worker"
        type: string

permissions:
  contents: read

jobs:
  windows-production-baseline:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install benchmark and parser dependencies
        run: python -m pip install -e ".[calamine,tika,wps,benchmarks]"

      - name: Build and install PyO3 wheel
        shell: pwsh
        run: |
          python -m pip install "maturin>=1.7,<2"
          maturin build --interpreter python --manifest-path crates/docseek-python/Cargo.toml --release
          python -c "import glob, os, subprocess, sys; wheels=sorted(glob.glob('target/wheels/docseek_rust-*.whl'), key=os.path.getmtime); assert wheels, 'no docseek_rust wheel'; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', wheels[-1]])"
          python -c "import docseek_rust; print(docseek_rust.__file__)"

      - name: Record Windows runner
        shell: pwsh
        run: |
          python --version
          rustc --version
          Get-ComputerInfo | Select-Object CsName, OsName, OsVersion, CsProcessors, CsTotalPhysicalMemory

      - name: Run production persistent-worker baseline
        shell: pwsh
        run: |
          $cases = @(
            @{ Workload = "docx"; Files = 500 },
            @{ Workload = "xlsx"; Files = 200 },
            @{ Workload = "pptx"; Files = 500 },
            @{ Workload = "pdf"; Files = 500 }
          )

          foreach ($case in $cases) {
            $output = "benchmark-persistent-$($case.Workload).txt"
            Write-Host "=== $($case.Workload) / $($case.Files) ==="
            python benchmarks/benchmark_scan.py `
              --workload $case.Workload `
              --files $case.Files `
              --backend both `
              --require-persistent-worker 2>&1 | Tee-Object -FilePath $output
            if ($LASTEXITCODE -ne 0) {
              throw "persistent benchmark failed for $($case.Workload) with exit code $LASTEXITCODE"
            }
          }

      - name: Upload production baseline reports
        uses: actions/upload-artifact@v4
        with:
          name: docseek-persistent-worker-windows-baseline
          path: benchmark-persistent-*.txt
          if-no-files-found: error
          retention-days: 30
