name: scale-benchmark

on:
  workflow_dispatch:
    inputs:
      files:
        description: "Synthetic file count"
        required: true
        default: "10000"
        type: choice
        options:
          - "10000"
          - "50000"
      chunks:
        description: "Chunks per file"
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "3"
          - "5"
      payload_kb:
        description: "Approximate payload KiB per chunk"
        required: true
        default: "4"
        type: choice
        options:
          - "1"
          - "4"
          - "8"

jobs:
  benchmark:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Search and index scale benchmark
        run: >-
          python benchmarks/benchmark_search.py
          --files ${{ inputs.files }}
          --chunks ${{ inputs.chunks }}
          --payload-kb ${{ inputs.payload_kb }}
          --iterations 5
          --warmups 2
          --limit 100
      - name: Unit tests after benchmark
        run: python -m unittest discover -s tests -v
