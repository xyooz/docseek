name: rust

on:
  push:
    branches:
      - main
      - "rust/**"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "src/docseek/indexer.py"
      - "src/docseek/scan_backend.py"
      - "src/docseek/legacy_worker.py"
      - "src/docseek/persistent_extraction.py"
      - "tests/test_full_index_backend_regression.py"
      - "tests/test_indexer_scan_backend.py"
      - "tests/test_persistent_extraction_worker.py"
      - "tests/test_scan_backend.py"
      - "tests/test_scan_backend_selection.py"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace
      - name: Test workspace
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build PyO3 wheel
        run: |
          python -m pip install maturin
          maturin build --interpreter python --manifest-path crates/docseek-python/Cargo.toml --release
      - name: Install and import PyO3 wheel
        run: |
          python -c "import glob, subprocess, sys; wheels=glob.glob('target/wheels/*.whl'); assert wheels, 'no maturin wheel'; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', wheels[0]])"
          python -c "import docseek_rust; controller=docseek_rust.JobController(); print(controller.last_snapshot())"
      - name: Install Python indexer dependencies
        run: python -m pip install PyMuPDF python-docx openpyxl python-pptx
      - name: Python scan backend parity
        run: python -m unittest tests.test_scan_backend -v
      - name: DirectoryIndexer Rust integration
        run: python -m unittest tests.test_indexer_scan_backend -v
      - name: Full index backend regression
        run: python -m unittest tests.test_full_index_backend_regression -v
      - name: Scan backend selection
        run: python -m unittest tests.test_scan_backend_selection -v
      - name: Persistent extraction worker
        run: python -m unittest tests.test_persistent_extraction_worker -v
