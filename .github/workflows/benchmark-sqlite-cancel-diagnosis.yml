name: benchmark-sqlite-cancel-diagnosis

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Git ref containing the cancellation diagnosis benchmark"
        required: true
        default: "perf/sqlite-cancel-diagnosis"
        type: string
      repeats:
        description: "Samples per phase and backend"
        required: true
        default: "20"
        type: string
      backend:
        description: "Indexer scanner backend(s) for phases A-D"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - python
          - rust

permissions:
  contents: read

jobs:
  windows-sqlite-cancel-diagnosis:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install benchmark and parser dependencies
        run: python -m pip install -e ".[calamine,tika,wps,benchmarks]"

      - name: Build and install PyO3 wheel
        shell: pwsh
        run: |
          python -m pip install "maturin>=1.7,<2"
          maturin build --interpreter python --manifest-path crates/docseek-python/Cargo.toml --release
          python -c "import glob, os, subprocess, sys; wheels=sorted(glob.glob('target/wheels/docseek_rust-*.whl'), key=os.path.getmtime); assert wheels, 'no docseek_rust wheel'; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', wheels[-1]])"
          python -c "import docseek_rust; print(docseek_rust.__file__)"

      - name: Record Windows runner
        shell: pwsh
        run: |
          python --version
          rustc --version
          Get-ComputerInfo | Select-Object CsName, OsName, OsVersion, CsProcessors, CsTotalPhysicalMemory

      - name: Run cancellation boundary diagnosis
        shell: pwsh
        run: |
          $console_report = "benchmark-cancel-boundaries-windows.log"
          $summary_report = "benchmark-cancel-boundaries-windows.txt"
          python benchmarks/benchmark_cancellation_boundaries.py `
            --backend "${{ inputs.backend }}" `
            --repeats ${{ inputs.repeats }} `
            --commit-rows 256 `
            --commit-payload-bytes 32768 `
            --json-out benchmark-cancel-boundaries-windows.json `
            --report-out $summary_report 2>&1 | Tee-Object -FilePath $console_report
          if ($LASTEXITCODE -ne 0) {
            throw "Cancellation boundary diagnosis failed with exit code $LASTEXITCODE"
          }

      - name: Upload cancellation diagnosis reports
        uses: actions/upload-artifact@v4
        with:
          name: docseek-sqlite-cancel-diagnosis-windows
          path: |
            benchmark-cancel-boundaries-windows.log
            benchmark-cancel-boundaries-windows.txt
            benchmark-cancel-boundaries-windows.json
          if-no-files-found: error
          retention-days: 30
