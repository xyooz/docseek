name: benchmark-isolation-cost

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Git ref containing the M7-C benchmark"
        required: true
        default: "perf/isolation-cost"
        type: string

permissions:
  contents: read

jobs:
  extraction-isolation:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install benchmark dependencies
        run: python -m pip install -e ".[benchmarks]"

      - name: Record runner versions
        shell: pwsh
        run: |
          @("python --version", "Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version", "Get-CimInstance Win32_ComputerSystem | Select-Object NumberOfLogicalProcessors,TotalPhysicalMemory") | ForEach-Object { Invoke-Expression $_ }

      - name: Run M7-C workload matrix
        shell: pwsh
        run: |
          $cases = @(
            @{ Workload = "docx"; Files = 100 },
            @{ Workload = "xlsx"; Files = 50 },
            @{ Workload = "pptx"; Files = 100 },
            @{ Workload = "pdf"; Files = 100 }
          )

          foreach ($case in $cases) {
            $output = "benchmark-isolation-$($case.Workload).json"
            Write-Host "=== $($case.Workload) / $($case.Files) ==="
            python benchmarks/benchmark_extraction_isolation.py `
              --workload $case.Workload `
              --files $case.Files `
              --mode all `
              --output $output 2>&1 | Tee-Object -FilePath "benchmark-isolation-$($case.Workload).txt"
            if ($LASTEXITCODE -ne 0) {
              throw "benchmark failed for $($case.Workload) with exit code $LASTEXITCODE"
            }
          }

      - name: Upload M7-C reports
        uses: actions/upload-artifact@v4
        with:
          name: docseek-isolation-cost-windows
          path: |
            benchmark-isolation-*.json
            benchmark-isolation-*.txt
          if-no-files-found: error
          retention-days: 30
