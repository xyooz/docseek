name: benchmarks

on:
  workflow_dispatch:
    inputs:
      files:
        description: Synthetic file count
        required: true
        default: "10000"
      chunks:
        description: Chunks per file
        required: true
        default: "3"
      payload_kb:
        description: Approximate payload KiB per chunk
        required: true
        default: "4"
      iterations:
        description: Timed query iterations
        required: true
        default: "3"

jobs:
  search-scaling:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Search scaling benchmark
        run: >-
          python benchmarks/benchmark_search_session.py
          --files ${{ inputs.files }}
          --chunks ${{ inputs.chunks }}
          --payload-kb ${{ inputs.payload_kb }}
          --iterations ${{ inputs.iterations }}
          --limit 100
      - name: Directory scan benchmark
        run: python benchmarks/benchmark_scan.py --files 100
