name: benchmarks

on:
  workflow_dispatch:
    inputs:
      workload:
        description: Benchmark workload
        required: true
        type: choice
        default: office
        options:
          - office
          - saturation
      files:
        description: Synthetic file count
        required: true
        default: "10000"
      chunks:
        description: Chunks per file
        required: true
        default: "3"
      payload_kb:
        description: Approximate payload KiB per chunk
        required: true
        default: "4"
      iterations:
        description: Timed query iterations
        required: true
        default: "3"

jobs:
  search-scaling:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Mixed office workload
        if: inputs.workload == 'office'
        run: >-
          python benchmarks/benchmark_office_workload.py
          --files ${{ inputs.files }}
          --chunks ${{ inputs.chunks }}
          --payload-kb ${{ inputs.payload_kb }}
          --iterations ${{ inputs.iterations }}
          --warmups 1
          --limit 100
      - name: Saturation search workload
        if: inputs.workload == 'saturation'
        run: >-
          python benchmarks/benchmark_search_session.py
          --files ${{ inputs.files }}
          --chunks ${{ inputs.chunks }}
          --payload-kb ${{ inputs.payload_kb }}
          --iterations ${{ inputs.iterations }}
          --limit 100
      - name: Directory scan benchmark
        run: python benchmarks/benchmark_scan.py --files 100
